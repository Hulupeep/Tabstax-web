<!doctype html>
<html lang="en">
<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@500;700;800&display=swap">
<style>
/* Layout: a fixed 1920x1080 stage (board left, shared TabStax pane right) scaled to fit, with a scrub bar under it. Single dark look: a night-shift ops room. */
:root{
  color-scheme:dark;
  --bg:#0c1016; --panel:#141a23; --panel2:#1b2330; --line:#29323f; --ink:#e7ebf0; --muted:#919eaf;
  --human:#f0b14a; --agent:#86a9ff; --good:#5fd39a; --amber:#ff9f43; --stall:#ff6b5e; --water:#3f8fd8; --land:#18202b; --landline:#3a4658;
  --display:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:8px;box-sizing:border-box}
#view{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);overflow:hidden;border-radius:6px}
body.rec{padding:0}
body.rec #app{padding:0;gap:0}
body.rec #controls{display:none}
body.rec #stage{border-radius:0}
.abs{position:absolute}
.hide{opacity:0;visibility:hidden}
/* controls */
#controls{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
#pips{display:flex;gap:4px;flex-wrap:wrap}
#pips button{flex:1 1 0;min-width:28px;background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:5px 4px;font:600 12px var(--mono);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pips button.on{color:var(--bg);background:var(--human);border-color:var(--human)}
#bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#bar button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 14px;font:600 13px var(--body);cursor:pointer}
#scrub{flex:1 1 200px;min-width:0;accent-color:var(--human)}
#tm{font-family:var(--mono);font-variant-numeric:tabular-nums;min-width:86px}
#bar label{display:flex;gap:6px;align-items:center;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--agent);outline-offset:2px}
.hint{font-size:12px}
/* drawer */
#drawer{position:absolute;right:8px;top:8px;bottom:8px;width:min(360px,calc(100% - 16px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-sizing:border-box;overflow:auto;z-index:5;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#drawer h3{font:700 18px/1.3 var(--display);margin:0 0 4px;text-wrap:balance}
#drawer .sub{color:var(--muted);font-size:13px;margin-bottom:12px}
#drawer ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
#drawer li{display:grid;grid-template-columns:52px 1fr;gap:8px;font-size:14px;line-height:1.35}
#drawer li time{font-family:var(--mono);color:var(--muted);font-size:13px}
#drawer .x{position:absolute;right:10px;top:10px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:2px 8px;cursor:pointer}
/* stage pieces */
.topbar{left:30px;top:20px;width:1860px;height:120px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.eyebrow{font:700 15px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mission{font:800 34px/1.1 var(--display);letter-spacing:-.01em}
.goal{left:640px;top:34px;width:340px;height:92px;border:2px solid var(--human);border-radius:12px;background:var(--panel2);padding:12px 16px;box-sizing:border-box}
.goal .k,.metric .k{font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.goal .v{font:700 22px/1.2 var(--display);margin-top:6px}
.metric .v{font:600 30px var(--mono);font-variant-numeric:tabular-nums;margin-top:6px}
.obs{display:flex;gap:10px;align-items:center}
.av{width:44px;height:44px;border-radius:50%;background:var(--panel2);border:1px dashed var(--muted);display:flex;align-items:center;justify-content:center;font:700 14px var(--display);position:relative}
.av .eye{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.av .ph{position:absolute;left:50%;top:50px;transform:translateX(-50%);font:600 11px var(--mono);color:var(--good);white-space:nowrap}
.rowlabel{font:700 13px var(--mono);letter-spacing:.14em;color:var(--muted)}
.col{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-sizing:border-box}
.col .hd{padding:10px 10px 0;display:flex;align-items:center;gap:7px;font:700 17px var(--display);white-space:nowrap}
.col .rl{padding:2px 10px 0;font-size:12px;color:var(--muted);line-height:1.3;height:32px;overflow:hidden}
.kd{width:10px;height:10px;border-radius:50%;flex:none}
.kd.h{background:var(--human)} .kd.a{background:var(--agent);border-radius:3px}
.badge{font:600 11px var(--mono);padding:2px 6px;border-radius:999px;border:1px dashed var(--muted);color:var(--muted)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 9px;box-sizing:border-box;font-size:14px;line-height:1.28;cursor:pointer;z-index:2}
.card:hover{border-color:var(--agent)}
.card .cw{font:500 11px/1.3 var(--mono);color:var(--muted);margin-top:5px;display:flex;gap:6px;align-items:center}
.card .sd{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.card.s-doing .sd{background:var(--agent);box-shadow:0 0 0 3px rgba(134,169,255,.25)}
.card.s-done{opacity:.55}
.card.s-done .sd{background:var(--good)}
.card.s-done .cw{color:var(--good)}
.card.s-amber{border-color:var(--amber)} .card.s-amber .sd{background:var(--amber)} .card.s-amber .cw{color:var(--amber)}
.card.s-stalled{border-color:var(--stall);box-shadow:0 0 0 1px var(--stall)} .card.s-stalled .sd{background:var(--stall)} .card.s-stalled .cw{color:var(--stall)}
.card.s-draft{border-color:var(--human)} .card.s-draft .sd{background:var(--human)} .card.s-draft .cw{color:var(--human)}
.card .dr{display:none;margin-top:6px;padding:6px 7px;border-left:2px solid var(--human);font-size:12px;color:var(--muted);font-style:italic}
.card.s-draft .dr{display:block}
.toast{width:300px;background:#0f1520;border:1.5px solid var(--agent);border-radius:10px;padding:10px 12px;box-sizing:border-box;z-index:4;box-shadow:0 8px 30px rgba(0,0,0,.55)}
.toast .th{font:600 11px var(--mono);color:var(--agent);letter-spacing:.06em}
.toast .tt{font:700 19px/1.2 var(--display);margin-top:4px}
.toast .tb{font-size:14px;color:var(--ink);margin-top:4px;line-height:1.3}
.tag{font:600 11px var(--mono);padding:3px 8px;border-radius:999px;border:1px dashed var(--human);color:var(--human);background:rgba(12,16,22,.85);white-space:nowrap;z-index:6}
body.noplanned .tag.planned{display:none}
.pane{left:1196px;top:160px;width:694px;height:845px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tabs{display:flex;gap:4px;padding:8px 8px 0;height:52px;box-sizing:border-box}
.tab{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;padding:5px 8px 18px;font:600 11px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.tab.on{background:var(--panel2);color:var(--ink)}
.pg-h{font:600 13px var(--mono);color:var(--muted)}
.dotm{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--bg)}
.pulse{width:16px;height:16px;border-radius:50%;z-index:7}
.cap{left:0;top:1016px;width:1920px;text-align:center;font:700 31px var(--display);letter-spacing:-.005em}
.ill{left:30px;top:1052px;font:500 13px var(--mono);color:var(--muted)}
.chat{left:440px;top:110px;width:1040px;height:860px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-sizing:border-box;padding:28px 36px}
.chat .ch{font:700 18px var(--display);color:var(--muted);display:flex;gap:10px;align-items:center}
.bub{margin-left:auto;margin-top:22px;max-width:760px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:18px 22px;font-size:24px;line-height:1.4;min-height:30px}
.rep{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.rl2{display:flex;gap:14px;align-items:center;font-size:23px}
.rl2 .ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--bg);font-weight:700;font-size:16px;flex:none}
.rl2.done .ck{background:var(--good);border-color:var(--good)}
.bigct{left:120px;top:150px}
.bigct .n{font:800 92px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bigct .l{font:600 22px var(--mono);color:var(--muted);margin-top:8px}
.audit{left:30px;top:160px;width:1150px;height:845px;background:rgba(12,16,22,.96);border:1px solid var(--line);border-radius:12px;padding:26px 30px;box-sizing:border-box;z-index:8}
.audit h4{margin:0 0 16px;font:800 30px var(--display)}
.arow{display:grid;grid-template-columns:70px 22px 200px 1fr;gap:10px;align-items:center;font-size:19px;padding:9px 0;border-bottom:1px solid var(--line)}
.arow time{font:600 16px var(--mono);color:var(--muted)}
.arow b{font:700 17px var(--mono)}
.end{left:0;top:0;width:1920px;height:1080px;background:rgba(12,16,22,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:20}
.end .l1{font:800 72px/1.1 var(--display);max-width:1500px;letter-spacing:-.02em;text-wrap:balance}
.end .l2{font:500 28px var(--body);color:var(--muted);margin-top:30px}
@media (max-width:600px){#pips button{font-size:10px;padding:4px 2px}.hint{display:none}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>

</head>
<body>
<div id="app">
  <div id="view"><div id="stage"></div>
    <aside id="drawer" hidden><button class="x" id="dx" aria-label="Close trail">Close</button><h3 id="dt"></h3><div class="sub" id="ds"></div><ol id="dl"></ol></aside>
  </div>
  <div id="controls">
    <div id="pips" role="group" aria-label="Scenes"></div>
    <div id="bar">
      <button id="pp" aria-label="Play or pause">Pause</button>
      <input id="scrub" type="range" min="0" max="146" step="0.05" value="0" aria-label="Timeline">
      <span id="tm">0:00</span>
      <label><input type="checkbox" id="pl" checked> Show planned</label>
      <span class="hint">Click any card to see its trail.</span>
    </div>
  </div>
</div>

<script>
(function(){
const DUR=146;
const S=document.getElementById('stage');
const REC=location.hash==='#rec';
if(REC)document.body.classList.add('rec');
const view=document.getElementById('view');
function fit(){const r=view.getBoundingClientRect();const s=Math.min(r.width/1920,r.height/1080);S.style.transform=`scale(${s}) translate(-50%,-50%)`;S.style.transformOrigin='0 0';S.style.left='50%';S.style.top='50%';S.style.transform=`translate(-50%,-50%) scale(${s})`;S.style.transformOrigin='center center';}
addEventListener('resize',fit);fit();

// ---------- helpers ----------
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const sm=x=>x*x*(3-2*x);
const seg=(t,a,b)=>sm(cl((t-a)/(b-a)));
const lerp=(a,b,k)=>a+(b-a)*k;
function mk(cls,html,parent){const d=document.createElement('div');d.className='abs '+cls;if(html!=null)d.innerHTML=html;(parent||S).appendChild(d);return d;}
function op(e,o){e.style.opacity=o;e.style.visibility=o<=0.002?'hidden':'visible';}
function pos(e,x,y){e.style.left=x+'px';e.style.top=y+'px';}
function keys(t,K){if(t<=K[0][0])return K[0][1];for(let i=1;i<K.length;i++){if(t<=K[i][0]){const k=(t-K[i-1][0])/(K[i][0]-K[i-1][0]);return lerp(K[i-1][1],K[i][1],k);}}return K[K.length-1][1];}
const hm=m=>{m=Math.round(m);const h=Math.floor(m/60)%24,mm=m%60;return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0');};
const NS='http://www.w3.org/2000/svg';
function sv(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}

// ---------- story clock and counters ----------
const T=(h,m)=>h*60+m;
const CLOCK=[[0,T(13,40)],[9,T(14,5)],[21,T(14,20)],[42,T(15,20)],[56,T(16,10)],[68,T(17,5)],[82,T(17,40)],[94,T(17,55)],[104,T(18,8)],[110,T(18,18)],[117,T(18,24)],[118.5,T(18,30)],[121,T(19,42)],[130,T(21,0)],[142,T(23,30)]];
const clock=t=>keys(t,CLOCK);
const HOMES=[[0,0],[2,0],[8,147000],[94,147000],[98,182000],[131,182000],[136,41000]];
const homes=t=>Math.round(keys(t,HOMES)/100)*100;
const HT=T(19,42);
const STORM=[[0,-11.2,51.0],[9,-10.0,51.75],[56,-9.8,52.4],[94,-9.5,52.9],[121,-9.1,53.3],[142,-8.3,54.7]];
function stormLL(t){return [keys(t,STORM.map(r=>[r[0],r[1]])),keys(t,STORM.map(r=>[r[0],r[2]]))];}

// ---------- Ireland ----------
const IRL=[[-7.37,55.38],[-7.0,55.25],[-6.95,55.17],[-6.65,55.21],[-6.15,55.22],[-5.8,54.85],[-5.9,54.65],[-5.45,54.5],[-5.55,54.3],[-6.0,54.05],[-6.35,54.0],[-6.25,53.72],[-6.1,53.35],[-6.0,52.97],[-6.2,52.6],[-6.35,52.35],[-6.35,52.17],[-6.93,52.12],[-7.55,52.05],[-7.85,51.95],[-8.25,51.8],[-8.53,51.6],[-9.2,51.48],[-9.8,51.45],[-10.15,51.6],[-9.9,51.75],[-10.4,51.9],[-10.5,52.1],[-9.85,52.3],[-9.95,52.4],[-9.93,52.56],[-9.5,52.8],[-9.4,53.05],[-9.15,53.15],[-9.05,53.25],[-9.6,53.25],[-10.2,53.4],[-10.05,53.5],[-9.9,53.65],[-10.2,53.95],[-10.0,54.25],[-9.35,54.32],[-8.6,54.3],[-8.2,54.55],[-8.75,54.65],[-8.45,54.9],[-8.3,55.15],[-7.65,55.27]];
function proj(k,ox,oy){return (lon,lat)=>[ox+(lon+10.7)*k,oy+(55.5-lat)*k*1.66];}
function pathFor(P){return 'M'+IRL.map(([a,b])=>P(a,b).map(v=>v.toFixed(1)).join(' ')).join(' L')+' Z';}
function inIRL(lon,lat){let c=false;for(let i=0,j=IRL.length-1;i<IRL.length;j=i++){const [xi,yi]=IRL[i],[xj,yj]=IRL[j];if(((yi>lat)!==(yj>lat))&&(lon<(xj-xi)*(lat-yi)/(yj-yi)+xi))c=!c;}return c;}

// one SVG for all map drawing, under the DOM layers
const G=sv('svg',{width:1920,height:1080,style:'position:absolute;left:0;top:0;pointer-events:none'},S);
const defs=sv('defs',{},G);
const rg=sv('radialGradient',{id:'rain'},defs);
[[0,'#c03cff',.95],[.25,'#ff3b3b',.9],[.5,'#ffb52e',.8],[.75,'#4fd17a',.55],[1,'#4fd17a',0]].forEach(([o,c,a])=>sv('stop',{offset:o,'stop-color':c,'stop-opacity':a},rg));
const bl=sv('filter',{id:'blur',x:'-50%',y:'-50%',width:'200%',height:'200%'},defs);sv('feGaussianBlur',{stdDeviation:7},bl);
function makeStorm(parent,r){
  const g=sv('g',{filter:'url(#blur)'},parent);const rot=sv('g',{},g);
  sv('circle',{cx:0,cy:0,r:r*.55,fill:'url(#rain)'},rot);
  [[0,r*.95,r*.32],[90,r*.85,r*.3],[180,r*.9,r*.28],[270,r*.75,r*.26]].forEach(([a,rx,ry],i)=>{const e=sv('ellipse',{cx:r*.45,cy:0,rx,ry,fill:'url(#rain)',opacity:.75,transform:`rotate(${a}) translate(${r*.1*i},0) rotate(-35)`},rot);});
  return {g,rot};
}

// --- scene 1 big map ---
const P1=proj(135,605,40);
const s1=sv('g',{},G);
sv('rect',{x:0,y:0,width:1920,height:1080,fill:'#0a1420'},s1);
sv('path',{d:pathFor(P1),fill:'#18202b',stroke:'#4a586c','stroke-width':2},s1);
const TOWNS=[['Cork',-8.47,51.9,4],['Killarney',-9.5,52.06,3],['Tralee',-9.7,52.27,5],['Bantry',-9.45,51.68,2.5],['Mallow',-8.64,52.13,6],['Kenmare',-9.58,51.88,3.5],['Skibbereen',-9.26,51.55,3],['Clonakilty',-8.9,51.62,5.5],['Dingle',-10.27,52.14,4.5],['Macroom',-8.96,51.9,6.5]];
const townEls=TOWNS.map(([n,lon,lat,off])=>{const [x,y]=P1(lon,lat);const g=sv('g',{},s1);const c=sv('circle',{cx:x,cy:y,r:7,fill:'#f0b14a'},g);const glow=sv('circle',{cx:x,cy:y,r:16,fill:'#f0b14a',opacity:.25},g);
  let lt=null;if(['Cork','Killarney','Tralee'].includes(n)){lt=sv('text',{x:x+14,y:y+5,fill:'#c9d2dd','font-size':20,'font-family':'Atkinson Hyperlegible, sans-serif'},g);lt.textContent=n;}return {c,glow,off};});
const [gx,gy]=P1(-9.05,53.27);
const galDot=sv('circle',{cx:gx,cy:gy,r:9,fill:'#e7ebf0'},s1);
const galLbl=sv('text',{x:gx+18,y:gy-6,fill:'#e7ebf0','font-size':28,'font-weight':700,'font-family':'Schibsted Grotesk, sans-serif'},s1);galLbl.textContent='Galway';
const galSub=sv('text',{x:gx+18,y:gy+24,fill:'#86a9ff','font-size':20,'font-family':'JetBrains Mono, monospace'},s1);galSub.textContent='High tide 19:42';
const arrow=sv('path',{d:'',fill:'none',stroke:'#e7ebf0','stroke-width':3,'stroke-dasharray':'8 10'},s1);
const storm1=makeStorm(s1,260);
// --- tab pane maps ---
const PX=1196,PY=160,PW=694,PH=845;
const clipP=sv('clipPath',{id:'pclip'},defs);sv('rect',{x:PX+1,y:PY+52,width:PW-2,height:PH-53,rx:10},clipP);
const pane=sv('g',{'clip-path':'url(#pclip)'},G);
const P2=proj(100,PX+80,PY+110);
const irl2=pathFor(P2);
const clipI=sv('clipPath',{id:'iclip'},defs);sv('path',{d:irl2},clipI);
function pageG(){const g=sv('g',{},pane);sv('rect',{x:PX,y:PY+44,width:PW,height:PH-44,fill:'#0a1420'},g);return g;}
// radar
const pgRadar=pageG();sv('path',{d:irl2,fill:'#18202b',stroke:'#4a586c','stroke-width':1.5},pgRadar);
const storm2=makeStorm(pgRadar,170);
// warnings
const pgWarn=pageG();
const wg=sv('g',{'clip-path':'url(#iclip)'},pgWarn);
sv('rect',{x:PX,y:PY,width:PW,height:PH,fill:'#d9b53a',opacity:.55},wg);
const [ox1,oy1]=P2(-8.9,52.1);sv('ellipse',{cx:ox1,cy:oy1,rx:190,ry:120,fill:'#f08a24',opacity:.85},wg);
const [rx1,ry1]=P2(-9.3,53.65);const redZ=sv('ellipse',{cx:rx1,cy:ry1,rx:140,ry:150,fill:'#e2392f',opacity:0},wg);
sv('path',{d:irl2,fill:'none',stroke:'#0a1420','stroke-width':2},pgWarn);
const wl=[['#e2392f','Red: Galway, Mayo from 17:00'],['#f08a24','Orange: Cork, Kerry, Clare'],['#d9b53a','Yellow: rest of Ireland']];

const ACT=[[32,'radar'],[58,'warn'],[70,'flood'],[78.5,'live'],[95,'power'],[103,'live'],[110,'power'],[118,'tide'],[120,'live'],[130,'radar']];

const fcast=mk('','');fcast.style.cssText+='width:300px;background:rgba(12,16,22,.9);border:1.5px solid var(--stall);border-radius:10px;padding:10px 12px;box-sizing:border-box;z-index:3';pos(fcast,PX+16,PY+96);

const BUOYS=[['M6','west Atlantic',98,15.2],['M3','off Cork',28,12.1],['M5','off Wexford',46,7.8],['M4','off Donegal',128,11.4],['M2','Irish Sea',112,5.6]];pos(tabTag,PX+16,PY+80);
// captions
const cap=mk('cap','');

const end=mk('end','<div class="l1">Every person. Every agent.<br>One board. One log.</div><div class="l2">HeyStax. Ready for the next named storm.</div>');

// ---------- render ----------
const $=id=>document.getElementById(id);
function render(t){
  // scene 1
  const s1o=1-seg(t,9,10.2);
  s1.style.opacity=s1o;s1.style.display=s1o<=0?'none':'';
  op(big,seg(t,1.2,2.2)*s1o);op(s1t,seg(t,3,4)*s1o);
  $('bn').textContent=homes(Math.min(t,9)).toLocaleString('en-IE');
  const [sl,sa]=stormLL(t);const [sx,sy]=P1(sl,sa);
  storm1.g.setAttribute('transform',`translate(${sx},${sy})`);storm1.rot.setAttribute('transform',`rotate(${-t*14})`);
  townEls.forEach(e=>{const k=seg(t,e.off,e.off+0.6);const c=k<1?'#f0b14a':'#3a4658';e.c.setAttribute('fill',k>0.5?'#3a4658':'#f0b14a');e.glow.setAttribute('opacity',.25*(1-k));});
  const ak=seg(t,5,7.5);const ax=lerp(sx,gx-20,ak),ay=lerp(sy,gy+20,ak);arrow.setAttribute('d',`M${sx} ${sy} L${ax} ${ay}`);arrow.setAttribute('opacity',ak>0?1:0);
  [galDot,galLbl,galSub].forEach(e=>e.setAttribute('opacity',seg(t,5,6)));
  // scene 2 chat
  const co=seg(t,9.6,10.6)*(1-seg(t,21,22));op(chat,co);
  ub.textContent=UMSG.slice(0,Math.floor(cl((t-10.4)/3.6)*UMSG.length));
  op(ub,seg(t,10,10.5));
  repLines.forEach((l,i)=>{const a=14.6+i*0.95;op(l,seg(t,a,a+0.4));l.classList.toggle('done',t>=a+0.5);});
  // board chrome
  const bo=seg(t,21.5,22.6);
  [top,eb,mis,goal,mClock,mPow,mTide].forEach(e=>op(e,bo));
  op(obs,seg(t,27,28));op(obsTag,seg(t,27.5,28.5));op(obsNote,seg(t,28,29));
  avs.forEach((a,i)=>{const k=seg(t,27+i*0.5,27.6+i*0.5);a.style.opacity=k;a.style.transform=`scale(${lerp(0.6,1,k)})`;});
  $('mc').textContent=hm(clock(t));
  $('mp').textContent=homes(t).toLocaleString('en-IE');
  const left=HT-clock(t);const lm=Math.round(left);$('mt').textContent=left>0.5?`${Math.floor(lm/60)}h ${String(lm%60).padStart(2,'0')}m`:(left>-15?'now':'passed');
  $('mt').style.color=left<=0.5&&left>-15?'var(--stall)':'';
  const gdone=t>=117.5;$('gv').textContent=gdone?'Flood zones clear ✓ 18:24':'Flood zones clear by 18:30';
  goal.style.borderColor=gdone?'var(--good)':'var(--human)';goal.style.transform=gdone&&t<119?`scale(${1+0.04*Math.sin((t-117.5)*Math.PI/1.5)})`:'';
  op(rlP,seg(t,22,23));op(rlA,seg(t,24.5,25.5));
  COLS.forEach((c0,n)=>{const c=C[c0[0]];const a=c.row===0?22.2+c.i*0.45:24.8+c.i*0.45;const k=seg(t,a,a+0.8);op(c.el,k);c.el.style.transform=`translateY(${lerp(30,0,k)}px)`;
    if(c.badge){const j=26.5+c.i*0.4;op(c.badge,k*(1-seg(t,j,j+0.4)));}});
  // cards
  cards.forEach(c=>{if(t<c.t0)return;const s=stateAt(c,t);c.el.className='abs card s-'+s[1];c.cwt.textContent=s[2];});
  cards.forEach(c=>{if(c.el.offsetHeight)c.h=c.el.offsetHeight;});
  cards.forEach(c=>{
    if(t<c.t0){op(c.el,0);return;}
    const s=stateAt(c,t);
    const col=C[c.col];
    let y=0;for(let i=0;i<6;i++)y+=slotY(c,Math.max(c.t0,t-i*0.12));y/=6;
    const x=col.x+8;
    const fk=seg(t,c.t0,c.t0+0.9);
    const src=C[c.from];const fx=src.x+20,fy=src.y+30;
    pos(c.el,lerp(fx,x,fk),lerp(fy,y,fk));op(c.el,Math.min(1,seg(t,c.t0,c.t0+0.25))*(s[1]==='done'?1:1));
    c.el.style.transform=fk<1?`scale(${lerp(0.85,1,fk)})`:'';
  });
  // toasts
  toasts.forEach(o=>{const k=seg(t,o.a,o.a+0.4)*(1-seg(t,o.b-0.4,o.b));const col=C[o.col];const x=Math.min(col.x,1170-300);pos(o.el,x,col.y-8-lerp(10,0,k)+(-o.el.offsetHeight)+60);op(o.el,k);
    o.el.style.top=(col.y+(col.row?84:54)+lerp(10,0,k))+'px';});
  // pulses
  pulses.forEach(p=>{const k=seg(t,p.a,p.b);const f=C[p.from];const card=cards.find(c=>c.id===p.to);const tx2=parseFloat(card.el.style.left)+20,ty2=parseFloat(card.el.style.top)+10;
    pos(p.el,lerp(f.x+30,tx2,k),lerp(f.y+20,ty2,k));op(p.el,t>p.a&&t<p.b?1:0);});
  obsP.forEach((p,i)=>{const a=113.6+i*0.3,b=a+1.2;const k=seg(t,a,b);const kc=C.coordinator;pos(p,lerp(kc.x+60,1594+i*54+14,k),lerp(kc.y+10,60,k));op(p,t>a&&t<b?1:0);});
  avs.forEach((a,i)=>{const ph=a.querySelector('.ph');ph.style.opacity=seg(t,114.8+i*0.3,115.3+i*0.3)*(1-seg(t,120,121));});
  op(phoneTag,seg(t,114.8,115.4)*(1-seg(t,120,121)));
  // pane
  const po=seg(t,32,33.2);op(paneEl,po);pane.style.opacity=po;
  const act=activeTab(t);
  for(const k in tabEls)tabEls[k].classList.toggle('on',k===act);
  for(const k in PAGES)PAGES[k].style.display=k===act?'':'none';
  pgHead.textContent=HEADS[act];op(pgHead,po);op(stylTag,po);
  // member dots gather on active tab
  const tabIdx=TABS.findIndex(x=>x[0]===act);
  dots.forEach((d,i)=>{const arr=33.4+i*0.55;const k=seg(t,arr,arr+0.5);const r=tabsEl.children[tabIdx];const tw=(PW-16-4*(TABS.length-1))/TABS.length;const bx=PX+8+tabIdx*(tw+4)+7+i*8.6, by=PY+36;
    pos(d,bx,by);op(d,k*po);});
  op(tabTag,seg(t,33.4,34)*(1-seg(t,44,45)));
  // storm on radar
  const P2s=P2(sl,sa);storm2.g.setAttribute('transform',`translate(${P2s[0]},${P2s[1]})`);storm2.rot.setAttribute('transform',`rotate(${-t*14})`);
  storm2.g.setAttribute('opacity',t>137?1-seg(t,137,140):1);
  redZ.setAttribute('opacity',.9*seg(t,58.3,59.3));

  // flood
  zones.forEach((z,i)=>{const k=seg(t,70.4+i*0.4,71+i*0.4);z.setAttribute('opacity',k*(0.45+0.15*Math.sin(t*3)));});
  const wk=seg(t,121.5,127);bayG.setAttribute('transform',`translate(0,${-lerp(0,52,wk)})`);
  floodChip.textContent=t>=117?(t>=121.5?'Claddagh: clear. 0 people in the flood zone':'Claddagh: 140 homes clear'):(t>=78?'Claddagh: evacuating':(t>=70.4?'High risk at 19:42 high tide':''));
  floodChip.setAttribute('fill',t>=117?'#5fd39a':'#e7ebf0');
  // live view
  const lv=act==='live'?po:0;
  op(buoy,lv);op(fcast,lv);op(liveTag,lv);
  if(lv){
    buoy.innerHTML='<div style="color:var(--muted);font-size:11px;letter-spacing:.08em">ATLANTIC BUOYS · WAVE HEIGHT</div>'+BUOYS.map(([n,w,pk,h])=>{const v=2+(h-2)*Math.exp(-Math.pow((t-pk)/30,2));const up=Math.exp(-Math.pow((t+1-pk)/30,2))>Math.exp(-Math.pow((t-pk)/30,2));return `<div style="display:flex;justify-content:space-between"><span><b>${n}</b> <span style="color:var(--muted)">${w}</span></span><span style="color:${v>10?'var(--stall)':'var(--ink)'}">${v.toFixed(1)} m ${up?'↑':'↓'}</span></div>`;}).join('')+'<div style="color:var(--muted);font-size:11px;margin-top:4px">Marine Institute network · readings illustrative</div>';
    const rev=t>=103;const upd=Math.floor(clock(t)/15)*15;
    fcast.innerHTML=`<div style="font:600 11px var(--mono);letter-spacing:.08em;color:var(--stall)">SURGE FORECAST · GALWAY PORT</div><div style="font:800 34px var(--display);margin-top:2px">${rev?'+1.0 m':'+0.9 m'} <span style="font:600 16px var(--mono);color:var(--muted)">peak 19:42</span></div><div style="font:500 12px var(--mono);color:var(--muted)">updated ${hm(upd)} · agent estimate, not official</div>`;
  }
  lzones.forEach((z,i)=>z.setAttribute('opacity',seg(t,79+i*0.3,79.7+i*0.3)*(0.7+0.3*Math.sin(t*2.4+i))));

  xpins.forEach((p,i)=>{const a=119.3+i*0.6;p.g.setAttribute('opacity',seg(t,a,a+0.4));const conf=i===0&&t>=126.5;p.c.setAttribute('fill',conf?'#ff6b5e':'none');p.c.setAttribute('stroke',conf?'#ff6b5e':'#ff9f43');p.b.setAttribute('fill',conf?'#0c1016':'#ff9f43');p.c.setAttribute('r',13+(t>a&&t<a+1.5?4*Math.sin((t-a)*6):0));});
  xlab.setAttribute('opacity',seg(t,120,120.5));xlab.textContent=t>=126.5?'Dock Road: confirmed by @fire':'X reports: unverified';xlab.setAttribute('fill',t>=126.5?'#ff6b5e':'#ff9f43');

// ---------- playback ----------
let t=0,playing=!REC,last=null;
const scrub=$('scrub'),pp=$('pp'),tm=$('tm');
const pipsEl=$('pips');
const pipBtns=SCENES.map((s,i)=>{const b=document.createElement('button');b.textContent=(i+1)+' '+SCENE_NAMES[i];b.title=SCENE_NAMES[i];b.onclick=()=>{t=s;closeTrail();draw();};pipsEl.appendChild(b);return b;});
function fmt(x){x=Math.floor(x);return Math.floor(x/60)+':'+String(x%60).padStart(2,'0');}
function draw(){render(t);scrub.value=t;tm.textContent=fmt(t)+' / '+fmt(DUR);let si=0;SCENES.forEach((s,i)=>{if(t>=s)si=i;});pipBtns.forEach((b,i)=>b.classList.toggle('on',i===si));pp.textContent=playing?'Pause':(t>=DUR?'Replay':'Play');}
function loop(ts){if(last==null)last=ts;const dt=(ts-last)/1000;last=ts;if(playing){t=Math.min(DUR,t+dt);if(t>=DUR)playing=false;draw();}requestAnimationFrame(loop);}
pp.onclick=()=>{if(t>=DUR)t=0;playing=!playing;closeTrail();draw();};
scrub.oninput=()=>{t=+scrub.value;draw();};
$('pl').onchange=e=>document.body.classList.toggle('noplanned',!e.target.checked);
addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='BUTTON'&&e.target.tagName!=='INPUT'){e.preventDefault();pp.click();}});
// trail drawer
const dr=$('drawer');
function openTrail(c){playing=false;$('dt').textContent=c.text;$('ds').textContent='In '+C[c.col].h+'’s column. Created by '+C[c.from].h+'.';
  const ol=$('dl');ol.innerHTML='';c.ev.filter(e=>e[0]<=t).forEach(e=>{const li=document.createElement('li');li.innerHTML=`<time>${hm(clock(e[0]))}</time><span>${e[2]}</span>`;ol.appendChild(li);});
  dr.hidden=false;draw();}
function closeTrail(){dr.hidden=true;}
$('dx').onclick=closeTrail;
window.render=render;window.DUR=DUR;
const go=()=>{fit();draw();requestAnimationFrame(loop);};
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(go);else go();
})();
</script>
